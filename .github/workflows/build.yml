name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: 29.0.14206865
  VULKAN_HEADERS_TAG: v1.3.275
  # The sample needs a full SDK, not just headers. This cannot match
  # VULKAN_HEADERS_TAG: LunarG delists old SDKs and 1.3.275.0 is already gone,
  # so this is the oldest still served. Expect to bump it periodically; the
  # current list is at https://vulkan.lunarg.com/sdk/versions/windows.json
  VULKAN_SDK_VERSION: 1.3.296.0

jobs:
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v5

      - name: Install NDK r29
        run: |
          set -eux
          # r29 is an rc, so it lives on the beta channel.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=1 \
            "ndk;${NDK_VERSION}" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage artifacts
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp build/libArm_ASR_api.a out/${{ matrix.abi }}/
          cp build/src/backends/vk/libArm_ASR_backend.a out/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ matrix.abi }}
          path: out/${{ matrix.abi }}

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The backend is a static library, so Vulkan headers are enough - there is
      # nothing to link against at this stage.
      - name: Fetch Vulkan headers
        run: git clone --depth 1 --branch ${{ env.VULKAN_HEADERS_TAG }} https://github.com/KhronosGroup/Vulkan-Headers.git

      # Release artifacts use the prebuilt SPIR-V so that every platform ships
      # byte-identical shader blobs.
      - name: Configure (prebuilt shaders)
        run: >
          cmake -B build -A x64
          -DFFXM_REMOVE_ARM_ASR_VK_STANDALONE_BACKEND=OFF
          -DFFXM_USE_PREBUILT_SHADERS=ON
          -DFFXM_VKLOADER_VOLK=OFF
          -DFFXM_VULKAN_PATH="${{ github.workspace }}/Vulkan-Headers/include"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out/windows-x64
          find build -name "Arm_ASR_api.lib" -exec cp {} out/windows-x64/ \;
          find build -name "Arm_ASR_backend.lib" -exec cp {} out/windows-x64/ \;
          ls -la out/windows-x64

      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: out/windows-x64

  # The sample needs the full SDK rather than just headers: it links vulkan-1.lib
  # and compiles its own GLSL with glslc. Build-only - the runners have no GPU,
  # so nothing here can actually execute a dispatch.
  windows-sample:
    name: Windows x64 sample
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile installer.exe
          Start-Process -FilePath .\installer.exe -Wait -ArgumentList `
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          $sdk = "C:\VulkanSDK\$ver"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) {
            throw "Vulkan SDK install did not produce $sdk"
          }
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) {
            throw "Vulkan SDK install produced no glslc at $sdk\Bin"
          }

      - name: Export VULKAN_SDK
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build-sample -S samples/windows -A x64

      - name: Build
        run: cmake --build build-sample --config Release

      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64-sample
          path: build-sample/Release/ArmAsrSample.exe

  # Non-blocking: proves the Windows-only FidelityFX_SC.exe shader pipeline still
  # works after the CMake restructuring. It cannot run on any other host.
  windows-shader-compiler:
    name: Windows shader compiler path
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Vulkan headers
        run: git clone --depth 1 --branch ${{ env.VULKAN_HEADERS_TAG }} https://github.com/KhronosGroup/Vulkan-Headers.git
      - name: Configure (compile shaders with FidelityFX_SC.exe)
        run: >
          cmake -B build-sc -A x64
          -DFFXM_REMOVE_ARM_ASR_VK_STANDALONE_BACKEND=OFF
          -DFFXM_USE_PREBUILT_SHADERS=OFF
          -DFFXM_VKLOADER_VOLK=OFF
          -DFFXM_VULKAN_PATH="${{ github.workspace }}/Vulkan-Headers/include"
      - name: Build
        run: cmake --build build-sc --config Release
